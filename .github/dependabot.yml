version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # xlsx is vendored from cdn.sheetjs.com (see vendor/README.md) and updated by hand.
    ignore:
      - dependency-name: xlsx

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
