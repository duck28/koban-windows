[package]
name = "koban"
version = "0.5.0"
description = "Koban for Windows: Minimalist Home & Freelancer Budgeting"
authors = ["Roland Matuz"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "koban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
base64 = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.11"
sha2 = "0.11"
getrandom = "0.2"
ureq = { version = "2.10", features = ["tls"] }
zeroize = "1.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.100"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
